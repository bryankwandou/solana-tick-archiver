name: archive
# Manual-only live stream fallback (24/7 schedule & self-chain disabled to stay well under
# MotherDuck Free Lite limits: 10 GB storage + 10 CU-hours/month. batch-2h.yml is the primary engine).
on:
  workflow_dispatch: {}
concurrency:
  group: archive
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - name: Stream DEX events to MotherDuck
        env:
          APERTURE_KEY: ${{ secrets.APERTURE_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          RUN_MIN: "340"
          FLUSH_SEC: "300"
          CAP_GB: "9"
        run: node fetch.mjs
