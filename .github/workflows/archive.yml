name: archive
# 24/7: each run streams ~5h40m, then dispatches the next run itself.
# The 6-hourly cron is only a safety net if a chain link ever breaks.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"
concurrency:
  group: archive
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - name: Stream DEX events to MotherDuck
        env:
          APERTURE_KEY: ${{ secrets.APERTURE_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          RUN_MIN: "340"
          FLUSH_SEC: "300"
          CAP_GB: "9"
        run: node fetch.mjs
      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run archive.yml -R ${{ github.repository }} --ref main
