name: backfill-ticks
# Manual 8-runner deep-recovery fallback only (2-hourly schedule replaced by single-runner batch-2h.yml).
on:
  workflow_dispatch:
concurrency: { group: backfill, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ranges: ${{ steps.plan.outputs.ranges }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - id: plan
        run: node plan.mjs
        env:
          APERTURE_KEY: ${{ secrets.APERTURE_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  backfill:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node backfill.mjs
        env:
          RANGES: ${{ needs.plan.outputs.ranges }}
          PART: ${{ matrix.part }}
          PARTS: 8
          CONC: 40
          APERTURE_KEY: ${{ secrets.APERTURE_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
